name: Verify and publish phone build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phone-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remotion/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci --no-audit --no-fund
        working-directory: remotion
      - run: npm run verify && npm run build
        working-directory: remotion
      - run: python3 scripts/package-phone.py
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: phone-build
          path: work/phone-publish/
          retention-days: 3
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: phone-build
          path: payload
      - uses: actions/checkout@v4
        with:
          path: repository
          fetch-depth: 1
      - name: Publish verified static package
        working-directory: repository
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          git fetch origin deploy-phone:refs/remotes/origin/deploy-phone || {
            if git ls-remote --exit-code origin refs/heads/deploy-phone; then exit 1; fi
          }
          if git show-ref --verify --quiet refs/remotes/origin/deploy-phone; then
            git checkout -B deploy-phone origin/deploy-phone
          else
            git checkout --orphan deploy-phone
            git rm -rf .
          fi
          cp ../payload/manifest.json ../payload/release.tar.gz .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json release.tar.gz
          if ! git diff --cached --quiet; then
            git commit -m "build(phone): publish verified ${SOURCE_COMMIT}"
            git push origin HEAD:deploy-phone
          fi
          echo "### Verified phone build" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: ${SOURCE_COMMIT}. The phone checks deploy-phone every minute and verifies all SHA-256 hashes before switching." >> "$GITHUB_STEP_SUMMARY"
